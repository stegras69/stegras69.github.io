<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="NotaVox">

<title>NotaVox – Note vocali con AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='14' y='26' width='5' height='12' rx='2.5' fill='white'/%3E%3Crect x='23' y='18' width='5' height='28' rx='2.5' fill='white'/%3E%3Crect x='32' y='22' width='5' height='20' rx='2.5' fill='white'/%3E%3Crect x='41' y='14' width='5' height='36' rx='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%234f46e5'/%3E%3Crect x='14' y='26' width='5' height='12' rx='2.5' fill='white'/%3E%3Crect x='23' y='18' width='5' height='28' rx='2.5' fill='white'/%3E%3Crect x='32' y='22' width='5' height='20' rx='2.5' fill='white'/%3E%3Crect x='41' y='14' width='5' height='36' rx='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#16141f;--muted:#6b6880;--line:#e7e4f0;--accent:#4f46e5;--accent2:#7c3aed;--soft:#eef0ff;--ok:#10b981;--danger:#e11d48;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:16px/1.45 'Inter',system-ui,-apple-system,sans-serif}
body{background:radial-gradient(1100px 600px at 110% -10%,#ede9fe 0,transparent 60%),radial-gradient(900px 500px at -20% 0,#e0f2fe 0,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit}
.app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 130px)}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px}
.brand{font-weight:800;font-size:28px;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:0 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.75);font-weight:600;font-size:15px;color:#3a3750;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.search label{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;font:inherit;background:transparent;color:var(--ink);min-width:0}
.daylabel{font-weight:700;font-size:14px;color:var(--muted);margin:20px 4px 8px;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;gap:13px;align-items:center;cursor:pointer;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,16,40,.04);width:100%;text-align:left}
.card:active{transform:scale(.99)}
.em{font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:var(--soft);border-radius:14px;flex:none}
.card .body{min-width:0;flex:1}
.card .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tag.warn{background:#fff7ed;color:#c2410c}
.empty{text-align:center;padding:40px 20px 10px;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:19px}
.empty svg{width:150px;height:auto;margin:10px auto}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;box-shadow:0 0 0 7px rgba(79,70,229,.14),0 12px 30px rgba(79,70,229,.45);cursor:pointer;z-index:20;display:grid;place-items:center}
.fab svg{width:32px;height:32px}
.botbtn{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(env(safe-area-inset-bottom) + 34px);width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,#312e81,#6d28d9);box-shadow:0 8px 22px rgba(49,46,129,.35);cursor:pointer;z-index:20;display:grid;place-items:center}
.botbtn svg{width:30px;height:30px}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(15,12,30,.38);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:680px;border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto;animation:up .22s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:#dcd9e6;margin:0 auto 12px}
.sheet h3{margin:4px 0 14px;font-size:19px}
.action{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--line);background:#fff;border-radius:16px;margin-bottom:10px;cursor:pointer;text-align:left}
.action .ai{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.action b{display:block}
.action small{color:var(--muted)}
.action.danger{color:var(--danger)}
.inp,.sel,textarea.inp{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:0;color:var(--ink)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.field{margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:14px;padding:13px 16px;font-weight:650;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:#f1effa;color:var(--ink)}
.btn.small{flex:none;padding:9px 14px;font-size:14px;border-radius:12px}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.55}
.note{font-size:13px;color:var(--muted);background:#faf9fd;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 12px}
.switch input{width:46px;height:28px;appearance:none;background:#d9d6e4;border-radius:999px;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
/* recorder */
.rec{position:fixed;inset:0;z-index:70;background:radial-gradient(800px 500px at 50% 0,#4338ca 0,#1e1b4b 60%,#0f0d24 100%);color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 24px);animation:fade .2s}
.rec .status{display:flex;align-items:center;gap:8px;font-weight:600;opacity:.9}
.dot{width:10px;height:10px;border-radius:50%;background:#f43f5e;animation:pulse 1.2s infinite}
.rec.paused .dot{animation:none;background:#fbbf24}
.timer{font-size:56px;font-weight:300;letter-spacing:.02em;text-align:center;margin:26px 0 8px;font-variant-numeric:tabular-nums}
.rec canvas{width:100%;height:90px;display:block}
.live{flex:1;overflow:auto;margin:16px 0;padding:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;font-size:17px;line-height:1.55}
.live .interim{opacity:.55}
.live .hint{opacity:.6;font-size:15px}
.recbar{display:flex;align-items:center;justify-content:space-around}
.rbtn{width:60px;height:60px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.rbtn svg{width:26px;height:26px}
.rbtn.stop{width:80px;height:80px;background:#fff;color:#e11d48}
.rbtn.stop svg{width:30px;height:30px}
/* note page */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;animation:slide .22s cubic-bezier(.2,.9,.3,1)}
.page .inner{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 40px)}
.ptop{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.ntitle{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px;display:flex;gap:10px;align-items:flex-start}
.nmeta{color:var(--muted);font-size:14px;margin-bottom:14px}
audio{width:100%;margin-bottom:12px;height:44px}
.seg{display:flex;background:#ebe8f5;border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:0;z-index:2}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:11px;font-weight:600;font-size:14px;color:#4b4862;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,16,40,.1)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h4{margin:16px 0 6px;font-size:15px}
.panel h4:first-child{margin-top:0}
.panel p{margin:0 0 10px}
.panel ul{margin:0 0 10px;padding-left:20px}
.panel li{margin-bottom:5px}
.sectiontitle{font-weight:700;font-size:15px;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:22px;height:22px;accent-color:var(--accent);margin:1px 0 0;flex:none;cursor:pointer}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tm{font-size:12.5px;color:var(--muted);margin-top:2px}
.task .src{color:var(--accent);cursor:pointer}
.line{display:flex;gap:10px;padding:9px 6px;border-radius:12px;cursor:pointer}
.line:hover{background:#faf9fd}
.line.cur{background:var(--soft)}
.line .ts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:42px;flex:none;padding-top:3px}
.sp{font-size:12px;font-weight:700;display:inline-block;margin-bottom:2px;cursor:pointer}
mark{background:#fde68a;border-radius:3px;padding:0 1px}
.mm{overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:200px}
.mm svg text{font-family:Inter,system-ui,sans-serif}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}.msg.a ul{margin:4px 0 8px;padding-left:18px}
.chatin{display:flex;gap:8px;margin-top:12px;position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(env(safe-area-inset-bottom) + 4px)}
.chatin input{flex:1}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.sugg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;color:#3a3750}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a5a1bf;margin:0 2px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
/* calendar */
.cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;text-transform:capitalize}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg .wd{font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.calg button{height:42px;border:0;background:transparent;border-radius:12px;cursor:pointer;position:relative;font-size:15px}
.calg button.out{color:#c7c4d4}
.calg button.today{font-weight:800;color:var(--accent)}
.calg button.sel{background:var(--ink);color:#fff}
.calg button.has::after{content:'';position:absolute;left:50%;bottom:6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent2)}
.calg button.sel.has::after{background:#fff}
.folder{display:flex;align-items:center;gap:13px}
.folder .em{background:#fff7e6}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);padding:14px 4px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #d9d6ea;border-top-color:var(--accent);animation:rot .8s linear infinite;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 110px);background:#1f1b33;color:#fff;padding:11px 16px;border-radius:14px;font-size:14.5px;z-index:100;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:up .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{animation:none}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="9" width="3" height="6" rx="1.5"/><rect x="8" y="5" width="3" height="14" rx="1.5"/><rect x="13" y="7" width="3" height="10" rx="1.5"/><rect x="18" y="3" width="3" height="18" rx="1.5"/></svg></div>NotaVox</div>
    <button class="iconbtn" id="btnSettings" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="search" id="searchbar">
    <label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cerca nelle note e trascrizioni" autocomplete="off"></label>
    <button class="iconbtn" id="btnSort" aria-label="Ordina"></button>
  </div>
  <div id="content"></div>
</div>

<button class="botbtn" id="btnBot" aria-label="Chiedi all'AI su tutte le note"><svg viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="16" rx="8" fill="#fff"/><circle cx="12" cy="17" r="2.6" fill="#312e81"/><circle cx="20" cy="17" r="2.6" fill="#312e81"/><rect x="15" y="4" width="2" height="5" rx="1" fill="#fff"/></svg></button>
<button class="fab" id="btnAdd" aria-label="Nuova registrazione"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<input type="file" id="fileIn" accept="audio/*,video/mp4,.m4a,.mp3,.wav,.webm,.ogg,.aac,.mp4" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const fmtDur = s => { s = Math.round(s || 0); const m = Math.floor(s / 60); if (m >= 60) return `${Math.floor(m/60)}h ${m%60}min`; return m ? `${m}min` : `${s}s`; };
const clock = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : String(m).padStart(2,'0')) + ':' + String(ss).padStart(2,'0'); };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayLabel = ts => { const k = dayKey(ts), t = dayKey(Date.now()), y = dayKey(Date.now() - 864e5); if (k === t) return 'Oggi'; if (k === y) return 'Ieri'; return new Date(ts).toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short', year: new Date(ts).getFullYear() === new Date().getFullYear() ? undefined : 'numeric'}); };
const timeLabel = ts => new Date(ts).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
const SPK_COLORS = ['#4f46e5','#db2777','#059669','#d97706','#0891b2','#7c3aed','#dc2626','#65a30d'];
let toastT;
function toast(msg, ms = 3200) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), ms); }
function md(text) {
  const lines = esc(text || '').split('\n'); let out = '', list = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + l.replace(/^\s*([-*•]|\d+[.)])\s+/, '') + '</li>'; }
    else { if (list) { out += '</ul>'; list = false; } if (/^#{1,6}\s/.test(l)) out += '<h4>' + l.replace(/^#+\s/, '') + '</h4>'; else if (l.trim()) out += '<p>' + l + '</p>'; }
  }
  return out + (list ? '</ul>' : '');
}
const hl = (html, q) => { if (!q) return html; const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); return html.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, txt) => tag || txt.replace(re, '<mark>$1</mark>')); };

/* ---------- storage (IndexedDB) ---------- */
const DB = {
  db: null,

const GEMINI_MODELS_FALLBACK = ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest'];
async function gemini(system, contents, {json = false, maxTokens = 8192} = {}) {
  const key = apiKey();
  if (!key) throw new Error('Manca la chiave gratuita di Google Gemini (Impostazioni ⚙️)');
  const models = [settings.geminiModel, ...GEMINI_MODELS_FALLBACK.filter(m => m !== settings.geminiModel)];
  let lastErr;
  for (const model of models) {
    const body = {contents, generationConfig: {maxOutputTokens: maxTokens, temperature: 0.3}};
    if (system) body.systemInstruction = {parts: [{text: system}]};
    if (json) body.generationConfig.responseMimeType = 'application/json';
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {method: 'POST', headers: {'content-type': 'application/json', 'x-goog-api-key': key}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      const parts = j.candidates?.[0]?.content?.parts || [];
      const text = parts.filter(p => !p.thought).map(p => p.text || '').join('');
      if (!text) throw new Error(j.promptFeedback?.blockReason ? 'Risposta bloccata (' + j.promptFeedback.blockReason + ')' : 'Risposta vuota dall’AI, riprova');
      if (model !== settings.geminiModel) { settings.geminiModel = model; saveSettings(); }
      return text;
    }
    const msg = j.error?.message || ('Errore ' + r.status);
    if (r.status === 429) { const daily = /per.?day|daily|PerDay/i.test(msg); const e = new Error(daily ? 'Limite giornaliero gratuito di Gemini raggiunto: riprova domani.' : 'Limite al minuto di Gemini raggiunto: riprova tra un minuto.'); e.rate = !daily; throw e; }
    if (r.status === 400 && /api key/i.test(msg)) throw new Error('Chiave Gemini non valida: controllala nelle Impostazioni.');
    lastErr = new Error(msg); lastErr.status = r.status;
    if (r.status !== 404) throw lastErr; // try next model only if this one doesn't exist
  }

}

      try {

  if (n.actions?.length) s += `## Attività\n${n.actions.map(a => `- [${a.done ? 'x' : ' '}] ${a.text}${a.owner ? ' — ' + a.owner : ''}${a.due ? ' (entro ' + a.due + ')' : ''}`).join('\n')}\n\n`;

  if (!notes.length && !load('nv_welcomed', false)) {
    store('nv_welcomed', true);
    const w = {id: uid(), title: 'Benvenuto su NotaVox', emoji: '🙌', createdAt: Date.now(), duration: 0, folder: '', source: 'text', audio: null, chat: [], userTitle: true,
      transcript: [{t: null, sp: 'NotaVox', text: 'Ciao! Tocca il pulsante + per registrare: mentre parli vedrai la trascrizione in tempo reale.'}, {t: null, sp: 'NotaVox', text: 'Quando finisci, l’AI crea riassunto, elenco delle attività e mappa mentale, e riconosce i diversi parlanti.'}, {t: null, sp: 'NotaVox', text: 'Puoi anche caricare file audio o incollare la trascrizione di una riunione Teams, Zoom o di un video YouTube.'}, {t: null, sp: 'NotaVox', text: 'Con il robot in basso a destra fai domande su tutte le tue registrazioni insieme.'}],
      summary: 'NotaVox registra, trascrive e riassume riunioni, lezioni e interviste.\n### Come iniziare\n' + (hasAI() ? '' : '- Apri **Impostazioni** (⚙️) e inserisci la chiave **gratuita** di Google Gemini\n') + '- Tocca **+** e scegli **Registra**, poi consenti l’uso del microfono\n- Per usarla come un’app: in Safari tocca **Condividi → Aggiungi a schermata Home**\n- Apri la nota per vedere **Riassunto**, **Trascrizione**, **Mappa** e **Chiedi AI**',
      actions: [...(hasAI() ? [] : [{id: uid(), text: 'Inserire la chiave Gemini gratuita nelle Impostazioni', owner: '', due: '', done: false}]), {id: uid(), text: 'Fare la prima registrazione', owner: '', due: '', done: false}],
      mindmap: {label: 'NotaVox', children: [{label: 'Registra', children: [{label: 'Trascrizione dal vivo'}, {label: 'Pausa e ripresa'}]}, {label: 'Importa', children: [{label: 'File audio'}, {label: 'Testo incollato'}]}, {label: 'AI', children: [{label: 'Riassunto'}, {label: 'Attività'}, {label: 'Mappa mentale'}, {label: 'Parlanti'}]}, {label: 'Organizza', children: [{label: 'Calendario'}, {label: 'Cartelle'}, {label: 'Ricerca'}]}]}};
    await saveNote(w);
  }
  renderHome();
})();
